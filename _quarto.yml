# ---- Factorized common metadata + format (2026-09) ----------------------------
# The six decks share author, affiliation, and every revealjs option except the
# things that vary per deck (title, subtitle, footer). Centralizing them here in
# the repo-root project removes the duplication that let e.g. the affiliation
# name drift between the base-R and RR decks.
#
# PATH RESOLUTION: relative paths in _quarto.yml resolve against the PROJECT
# ROOT (the folder containing this file), NOT against each document. So
# resources/... and theme/... below are project-root-relative. The per-deck
# front matter previously used doc-relative ../../resources/... paths; those
# moved here unchanged in meaning, rewritten as bare root-relative paths.
# Named revealjs extensions (codewindow, tabset, arrows, roughnotation,
# zoom-vp) resolve from the root _extensions/ regardless — no path change.
author:
  - name: A. Stamm
    affiliations:
      - ref: lmjl
    corresponding: true
    orcid: 0000-0002-8725-3654
affiliations:
  - id: lmjl
    name: Department of Mathematics Jean Leray, UMR CNRS 6629, Nantes University
    city: Nantes
    country: France
    url: https://www.math.sciences.univ-nantes.fr/

# Centralized CNRS logo as a base64 data URI so it renders under BOTH
# `file://` (opened from Finder) and HTTP (`quarto preview` / deployed).
# A relative path like ../../resources/logo/logo-cnrs.png is blocked by
# browsers under file:// (no ../ traversal across directories), so each
# deck's individual `logo:` entry was removed in favor of this single source.
format:
  revealjs:
    logo: "data:image/png;base64,"
    width: 1280
    height: 700
    margin: 0
    center: false
    auto-animate-duration: 0.9
    number-sections: true
    code-overflow: wrap
    include-after-body:
      - resources/slidecrafting/spread-script.html
      - resources/slidecrafting/mono-whitespace.html
      - resources/slidecrafting/logo-link.html
      - resources/slidecrafting/paper-adv-popup.html
    theme: [default, resources/slidecrafting/styles_template.scss, theme/scss/ensai-theme.scss]

revealjs-plugins:
  - codewindow
  - tabset

filters:
  - arrows
  - roughnotation
  - zoom-vp
  - resources/slidecrafting/code-pop.lua

knitr:
  opts_chunk:
    dev.args: { bg: "transparent" }
